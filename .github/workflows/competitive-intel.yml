name: Competitive intelligence digest

on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays 06:23 UTC (08:23 in Athens); an odd minute avoids the busy top of the hour
  workflow_dispatch:        # adds a manual "Run workflow" button

permissions:
  contents: write           # lets the job commit snapshots back to the repo

concurrency:
  group: competitive-intel
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: competitive-intel-agent
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: competitive-intel-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: not-a-real-key   # the tests never call the API
        run: python -m pytest -q

      - name: Fetch sources
        id: fetch
        continue-on-error: true               # a failed source must not stop the digest
        run: python fetch.py

      - name: Detect changes
        run: python diff.py

      - name: Write digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python digest.py

      - name: Email digest
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python send_email.py

      - name: Save snapshots and digest
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitive-intel-agent/snapshots/latest competitive-intel-agent/digests competitive-intel-agent/runs.jsonl
          git commit -m "Weekly run: snapshots, digest and run log" || echo "Nothing to commit"
          git pull --rebase origin main
          git push

      - name: Fail the run if any source failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "One or more sources failed. See the Fetch sources step."
          exit 1